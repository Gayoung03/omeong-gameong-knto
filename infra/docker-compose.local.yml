services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omeong-gameong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omeong}
      POSTGRES_USER: ${POSTGRES_USER:-omeong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omeong}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omeong} -d ${POSTGRES_DB:-omeong}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-omeong}:${POSTGRES_PASSWORD:-omeong}@postgres:5432/${POSTGRES_DB:-omeong}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-omeong}:${POSTGRES_PASSWORD:-omeong}@postgres:5432/${POSTGRES_DB:-omeong}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api/scripts:/app/scripts

volumes:
  postgres-data:
