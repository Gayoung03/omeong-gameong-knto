# 프로덕션 덤프 리허설용 Postgres.
#
# 목적: 실제 프로덕션(Railway) 덤프를 격리된 로컬 DB 에 복원해두고, 새 마이그레이션·
#       파싱 배치를 "프로덕션과 같은 데이터" 위에서 미리 돌려보는(리허설) 환경.
#       migration-smoke 는 빈 DB 위 up/down 재현 검사라 목적이 다르다 — 이쪽은 데이터가 있다.
#
# 로컬 개발 DB(docker-compose.local.yml, 5432)와 포트·컨테이너명·볼륨을 모두 분리해
# 동시에 떠 있어도 충돌하지 않는다. 호스트 포트 기본 5433.
#
# 이미지 태그는 복원할 덤프의 서버 버전 이상이어야 한다(신버전 서버 덤프는 구버전
# 도구로 복원 불가). 기본 pg18 = 프로덕션(Railway PostgreSQL 18.6) 기준. pg18 도구는
# 프로덕션(18) 덤프와 dev(RDS 16.14) 덤프를 모두 복원할 수 있어 기본값 하나로 충분하다.
# 다른 버전이 필요하면 REHEARSAL_PG_IMAGE 로 덮어쓴다.
name: omeong-rehearsal

services:
  postgres-rehearsal:
    image: ${REHEARSAL_PG_IMAGE:-pgvector/pgvector:pg18}
    container_name: omeong-gameong-postgres-rehearsal
    environment:
      POSTGRES_DB: ${REHEARSAL_PG_DB:-omeong}
      POSTGRES_USER: ${REHEARSAL_PG_USER:-omeong}
      POSTGRES_PASSWORD: ${REHEARSAL_PG_PASSWORD:-omeong}
    ports:
      - "${REHEARSAL_PG_PORT:-5433}:5432"
    volumes:
      # PG 18+ 도커 이미지는 데이터 디렉터리 관례가 바뀌어 마운트 지점이 /var/lib/postgresql
      # (하위에 메이저별 디렉터리 생성). 이 지점은 pg16 이미지와도 호환된다.
      - rehearsal-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REHEARSAL_PG_USER:-omeong} -d ${REHEARSAL_PG_DB:-omeong}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 복원된 리허설 DB 위에서 마이그레이션을 돌려보는 일회성 서비스.
  # profiles 로 감춰서 `up` 만으로는 뜨지 않고, `make db-rehearsal-migrate` 에서만 실행된다.
  migrate-rehearsal:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${REHEARSAL_PG_USER:-omeong}:${REHEARSAL_PG_PASSWORD:-omeong}@postgres-rehearsal:5432/${REHEARSAL_PG_DB:-omeong}
      # alembic 이 app 설정을 import 하므로 더미 SECRET_KEY 로 충분하다(리허설 격리 실행).
      SECRET_KEY: ${SECRET_KEY:-rehearsal-only-not-a-real-secret-000000}
    depends_on:
      postgres-rehearsal:
        condition: service_healthy
    profiles: ["migrate"]
    command:
      - /bin/sh
      - -ec
      - |
        echo "── 리허설: 복원본 현재 리비전 ──"
        .venv/bin/alembic current
        echo "── 리허설: upgrade head ──"
        .venv/bin/alembic upgrade head
        .venv/bin/alembic current --check-heads

volumes:
  rehearsal-data:
