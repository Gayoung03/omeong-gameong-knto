services:
  migrate:
    build: ../apps/api
    container_name: omeong-gameong-migrate
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY를 .env에 설정하세요.}
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$${DATABASE_URL}" || { echo "MIGRATION_DATABASE_URL을 .env에 설정하세요."; exit 1; }
        .venv/bin/alembic upgrade head
        .venv/bin/alembic current --check-heads
        .venv/bin/alembic check

  api:
    build: ../apps/api
    container_name: omeong-gameong-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Omeong Gameong API}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 .env에 설정하세요.}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY를 .env에 설정하세요.}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # 챗봇. 키가 없으면 답변 생성만 502 로 실패하고 나머지 API 는 정상 동작한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TMAP_API: ${TMAP_API:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api/app:/app/app
    command:
      - .venv/bin/fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=2)
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
