[project]
name = "omeong-gameong-api"
version = "0.1.0"
description = "Backend API for the Omeong Gameong mobile application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.43,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "openai>=3.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
